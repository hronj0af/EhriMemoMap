# Ukázková konfigurace nginx pro Vue klienta MemoMap (memomap.cz běží na nginx).
# Do stávající konfigurace serveru je potřeba převzít hlavně bloky "location" – certifikáty, server_name
# a cestu k souborům upravte podle serveru. Obsah adresáře dist/ (npm run build) patří do "root".

server {
    listen 443 ssl http2;
    server_name memomap.cz www.memomap.cz;

    # ssl_certificate     /etc/...;
    # ssl_certificate_key /etc/...;

    root /var/www/memomap;   # obsah dist/
    index index.html;

    # komprese textových souborů (JS, CSS, JSON, SVG)
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # sestavené JS/CSS/písma mají v názvu hash (např. index-CfQg4V_G.js) → mohou se cachovat natrvalo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html a konfigurace se cachovat nesmí – po nasazení se musí načíst nové názvy souborů / nastavení
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(appsettings(\.Development)?|mapsettings\.[a-z_]+)\.json$ {
        add_header Cache-Control "no-cache";
    }

    # SPA: cesty aplikace (/prague, /pacov, /ricany, …) neexistují jako soubory → index.html se stavem 200.
    # (Současný Blazor web to řeší přes stránku pro 404, takže tyto adresy vracejí stav 404 – vyhledávače
    #  a náhledy odkazů je pak berou jako neexistující.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
